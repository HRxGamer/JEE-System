workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60

    scripts:
      - name: Install Gradle
        script: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH

      - name: Build APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
